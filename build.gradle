plugins {
    id 'java-library'
    id 'maven-publish'
    id 'org.bytedeco.gradle-javacpp-platform' version '1.5.7-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '7.0.0'
//    id 'org.bytedeco.gradle-javacpp-build' version '1.5.6'
}


group 'com.github.qupath'
version '1.0-SNAPSHOT'

allprojects {
    repositories {
        mavenCentral()
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
        maven { url "https://maven.scijava.org/content/repositories/releases"}
//        maven { url "https://jitpack.io" }
    }
}

// Machine-specific locations. Set these in ~/.gradle/gradle.properties or pass them with -P, e.g.
//   ./gradlew shadowJar -PqupathAppDir=/path/to/QuPath-0.3.0/app -PqupathTensorflowJar=/path/to/qupath-extension-tensorflow-0.3.0.jar
def qupathAppDir = findProperty('qupathAppDir')
def qupathTensorflowJar = findProperty('qupathTensorflowJar')
if (qupathAppDir == null || qupathTensorflowJar == null) {
    throw new GradleException('Set the qupathAppDir (folder containing the QuPath 0.3.0 jars) and ' +
            'qupathTensorflowJar (qupath-extension-tensorflow-0.3.0.jar) Gradle properties. See README.md.')
}

dependencies {

    shadow "fr.inra.ijpb:MorphoLibJ_:1.4.0"
//    shadow 'org.bytedeco:gradle-javacpp:1.5.6'

//    implementation "com.github.qupath:qupath-extension-tensorflow:0.3.0"

    shadow files(qupathTensorflowJar)
    implementation 'org.bytedeco:javacv-platform:1.5.7-SNAPSHOT'
//    shadow 'org.bytedeco:javacpp:1.5.5'
    implementation 'org.bytedeco:javacpp-presets-platform:1.5.5'
    shadow 'org.tensorflow:tensorflow-core-platform:0.4.0'

    implementation fileTree(dir: qupathAppDir, include: '*.jar')
    String javaFxVersion = '11'
    implementation group: 'org.openjfx', name: 'javafx-base', version: javaFxVersion, classifier: 'win'
    implementation group: 'org.openjfx', name: 'javafx-base', version: javaFxVersion, classifier: 'mac'
    implementation group: 'org.openjfx', name: 'javafx-base', version: javaFxVersion, classifier: 'linux'
    implementation group: 'org.openjfx', name: 'javafx-controls', version: javaFxVersion, classifier: 'win'
    implementation group: 'org.openjfx', name: 'javafx-controls', version: javaFxVersion, classifier: 'mac'
    implementation group: 'org.openjfx', name: 'javafx-controls', version: javaFxVersion, classifier: 'linux'
    implementation group: 'org.openjfx', name: 'javafx-fxml', version: javaFxVersion, classifier: 'win'
    implementation group: 'org.openjfx', name: 'javafx-fxml', version: javaFxVersion, classifier: 'mac'
    implementation group: 'org.openjfx', name: 'javafx-fxml', version: javaFxVersion, classifier: 'linux'
    implementation group: 'org.openjfx', name: 'javafx-graphics', version: javaFxVersion, classifier: 'win'
    implementation group: 'org.openjfx', name: 'javafx-graphics', version: javaFxVersion, classifier: 'mac'
    implementation group: 'org.openjfx', name: 'javafx-graphics', version: javaFxVersion, classifier: 'linux'

}


test {
    useJUnitPlatform()
}


shadowJar{
    configurations = [project.configurations.shadow]
}
